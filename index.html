<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root, [data-theme="dark"]{
  --bg:#0b0d12;--card:#151922;--card2:#1c2130;--txt:#f1f3f7;--muted:#8b93a7;
  --blue:#3b82f6;--blue2:#60a5fa;--pink:#ec4899;--pink2:#f9a8d4;
  --green:#22c55e;--orange:#f59e0b;--red:#ef4444;
  --bd:rgba(255,255,255,.08);--nav:76px;
  --tip-bg:rgba(22,26,38,.88);--tip-title:#f1f3f7;--tip-body:#d0d5e0;--tip-bd:rgba(255,255,255,.14);
  --grid:rgba(255,255,255,.05);--navbg:rgba(11,13,18,.95);
}
[data-theme="light"]{
  --bg:#f4f6fa;--card:#ffffff;--card2:#eef1f6;--txt:#1a1d26;--muted:#6b7280;
  --blue:#2563eb;--blue2:#3b82f6;--pink:#db2777;--pink2:#ec4899;
  --green:#16a34a;--orange:#d97706;--red:#dc2626;
  --bd:rgba(0,0,0,.08);--nav:76px;
  --tip-bg:rgba(255,255,255,.94);--tip-title:#1a1d26;--tip-body:#4b5563;--tip-bd:rgba(0,0,0,.1);
  --grid:rgba(0,0,0,.06);--navbg:rgba(244,246,250,.95);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;padding-top:max(14px,env(safe-area-inset-top))}
.header h1{font-size:1.2rem;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn svg{width:20px;height:20px;display:block}
.main{flex:1;overflow-y:auto;padding:4px 16px 110px;-webkit-overflow-scrolling:touch}
.screen{display:none}
.screen.active{display:block;animation:screenIn .55s cubic-bezier(.25,.1,.25,1) both}
.screen.active.from-left{animation-name:screenInLeft}

.ccard{background:var(--card);border-radius:22px;padding:16px;margin-bottom:16px;border:1px solid var(--bd)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ch h2{font-size:1rem;font-weight:600}
.sel{background:var(--bg);color:var(--txt);border:1px solid var(--bd);border-radius:12px;padding:7px 12px;font-size:.82rem;outline:none}
.cbox{position:relative;height:250px;margin:6px 0 4px}
.leg{display:flex;justify-content:center;gap:24px;margin-top:6px;font-size:.8rem;color:var(--muted);font-weight:500}
.leg span{display:flex;align-items:center;gap:7px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.leg .a{background:var(--blue)}.leg .b{background:var(--pink)}
.chart-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.cs{text-align:center;padding:10px 4px;border-radius:14px;background:var(--bg);cursor:pointer;border:1px solid transparent}
.cs:active{transform:scale(.97)}
.cs.on{border-color:var(--blue);background:rgba(59,130,246,.12)}
.cs.b.on{border-color:var(--pink);background:rgba(236,72,153,.12)}
.cs.s.on{border-color:var(--orange);background:rgba(245,158,11,.12)}
.cs .cl{font-size:.68rem;color:var(--muted);margin-bottom:4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs .cv{font-size:1.05rem;font-weight:800;letter-spacing:-.3px}
.cs.a .cv{color:var(--blue2)}.cs.b .cv{color:var(--pink2)}.cs.s .cv{color:var(--orange)}

.sh{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:8px}
.sh h2{font-size:.95rem;font-weight:600}
.lk{background:none;border:none;color:var(--blue);font-size:.82rem;font-weight:500;cursor:pointer}
.sort-btn{background:none;border:none;color:var(--muted);width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:color .2s,background .2s}
.sort-btn:active{background:var(--card2);color:var(--txt)}
.sort-btn svg{width:20px;height:20px;display:block;transition:transform .45s cubic-bezier(.25,.1,.25,1)}
.sort-btn.asc svg{transform:rotate(180deg)}
.search-slot{position:relative;display:flex;align-items:center;height:36px;min-width:36px}
.search-expand{position:absolute;right:0;top:0;height:36px;width:36px;overflow:hidden;background:transparent;border:1px solid transparent;border-radius:18px;display:flex;align-items:center;transition:width .48s cubic-bezier(.25,.1,.25,1),background .3s ease,border-color .3s ease,box-shadow .35s ease;z-index:6}
.search-expand.open{width:min(230px,62vw);background:var(--card);border-color:var(--blue);box-shadow:0 6px 24px rgba(59,130,246,.18)}
.search-expand input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--txt);font-size:.88rem;padding:0 4px 0 0;opacity:0;width:0;transition:opacity .25s ease .15s}
.search-expand input::-webkit-search-cancel-button,
.search-expand input::-webkit-search-decoration{display:none;-webkit-appearance:none;appearance:none}
.search-expand.open input{opacity:1}
.search-expand .s-ico{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border:none;background:none;padding:0}
.search-expand .s-ico svg{width:18px;height:18px}
.search-expand.open .s-ico{color:var(--blue)}
.search-expand .s-close{display:none;width:28px;height:28px;margin-right:4px;border:none;background:none;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.search-expand.open .s-close{display:flex}
.search-expand .s-close svg{width:16px;height:16px}
.dlg-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
.dlg-ov.open{display:flex;animation:fadeIn .3s ease}
.dlg{background:rgba(28,33,48,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:20px;padding:22px 20px 18px;max-width:320px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.45);animation:dlgIn .4s cubic-bezier(.25,.1,.25,1)}
.dlg h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.dlg p{font-size:.9rem;color:var(--muted);line-height:1.45;margin-bottom:18px}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end}
.dlg-actions button{padding:10px 18px;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;border:none}
.dlg-ok{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.dlg-cancel{background:var(--bg);color:var(--muted);border:1px solid var(--bd)!important}
.dlg-danger{background:rgba(239,68,68,.2);color:#ef4444}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(12px)}}
@keyframes fabPulse{0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes screenIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes screenInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes ripple{0%{transform:scale(0);opacity:.35}100%{transform:scale(2.2);opacity:0}}
.pl{position:relative;overflow:hidden}
.pl.pulse{animation:fabPulse .42s ease}
.ripple-dot{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none;animation:ripple .6s ease-out forwards;margin:-9px 0 0 -9px}

.list{display:flex;flex-direction:column;gap:8px}
.tx{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:11px;border:1px solid var(--bd);cursor:pointer;border-left:3px solid transparent}
.tx.pa{border-left-color:var(--blue)}.tx.pb{border-left-color:var(--pink)}
.tx:active{background:var(--card2)}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:18px;height:18px;display:block}
.ic.ok{background:rgba(34,197,94,.15);color:var(--green)}
.ic.no{background:rgba(245,158,11,.15);color:var(--orange)}
.bd{flex:1;min-width:0}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;gap:8px}
.am{font-weight:700;font-size:.95rem;flex-shrink:0}
.st{font-size:.7rem;font-weight:600;white-space:nowrap;flex-shrink:0}
.st.ok{color:var(--green)}.st.no{color:var(--orange)}
.mt{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt b{font-weight:500;color:var(--txt)}

.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;height:var(--nav);background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:100;border-radius:24px 24px 0 0}
.theme-row{display:flex;gap:8px;margin-bottom:14px}
.theme-btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer}
.theme-btn.active{border-color:var(--blue);background:rgba(59,130,246,.12);color:var(--blue)}
.nb{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;cursor:pointer;padding:6px 10px;flex:1}
.nb.active{color:var(--blue)}.nb.c{position:relative;top:-18px}
.nb svg{width:22px;height:22px;display:block}
.pl{width:54px;height:54px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(59,130,246,.45)}
.pl svg{width:26px;height:26px;stroke:#fff;stroke-width:2.5}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fb{background:var(--card);border:1px solid var(--bd);color:var(--muted);border-radius:22px;padding:7px 13px;font-size:.78rem;cursor:pointer}
.fb.active{background:rgba(59,130,246,.16);border-color:var(--blue);color:var(--blue)}
.fb.b.active{background:rgba(236,72,153,.16);border-color:var(--pink);color:var(--pink)}
.fb.o.active{background:rgba(245,158,11,.16);border-color:var(--orange);color:var(--orange)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:16px 12px}
.ov{opacity:0;transition:opacity .32s ease}
.ov.open{display:flex;opacity:1}
.md{background:var(--card);width:100%;max-width:420px;border-radius:24px;padding:20px 18px 24px;max-height:88vh;overflow-y:auto;animation:modalIn .45s cubic-bezier(.25,.1,.25,1)}
.ov.closing{opacity:0}
.ov.closing .md{animation:modalOut .3s ease forwards}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h2{font-size:1.12rem;font-weight:700}
.x{background:var(--bg);border:1px solid var(--bd);color:var(--muted);width:36px;height:36px;border-radius:12px;font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

.fg{margin-bottom:13px}
.fg label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:.95rem;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue)}
.fg input::placeholder,.fg textarea::placeholder{color:#4a5160}
.fg textarea{resize:vertical;min-height:60px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rg{display:flex;gap:8px}
.ro{flex:1;text-align:center;padding:12px 6px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro.active{border-color:var(--blue);background:rgba(59,130,246,.14);color:var(--blue)}
.ro.b.active{border-color:var(--pink);background:rgba(236,72,153,.14);color:var(--pink)}
.ro.o.active{border-color:var(--orange);background:rgba(245,158,11,.14);color:var(--orange)}
.bs{width:100%;padding:15px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:14px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:4px}
.brow{display:flex;gap:10px;margin-top:12px}
.brow button{flex:1;padding:13px;border-radius:14px;font-size:.9rem;font-weight:600;cursor:pointer;border:none}
.bdel{background:rgba(239,68,68,.15);color:var(--red)}
.bcan{background:var(--bg);color:var(--muted);border:1px solid var(--bd)!important}

.row{width:100%;text-align:left;padding:14px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;color:var(--txt);font-size:.9rem;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.row small{display:block;color:var(--muted);font-size:.74rem;font-weight:400;margin-top:3px}
.row svg{flex-shrink:0;width:20px;height:20px}
.info{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px;font-size:.82rem;color:var(--muted);line-height:1.45}
.info b{color:var(--txt)}
.sep{height:1px;background:var(--bd);margin:14px 0}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1 id="appTitle">Portafogli</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <main class="main">
    <section id="home" class="screen active">
      <div class="ccard">
        <div class="ch">
          <h2>Andamento</h2>
          <select id="per" class="sel"><option value="all" selected>Tutto</option></select>
        </div>
        <div class="cbox"><canvas id="ch"></canvas></div>
        <div class="leg">
          <span><i class="a"></i><span id="legA">A</span></span>
          <span><i class="b"></i><span id="legB">B</span></span>
        </div>
        <div class="chart-stats">
          <div class="cs a" id="tapA"><div class="cl" id="labA">A</div><div class="cv" id="csA">€ 0</div></div>
          <div class="cs b" id="tapB"><div class="cl" id="labB">B</div><div class="cv" id="csB">€ 0</div></div>
          <div class="cs s" id="tapSos"><div class="cl">In sospeso</div><div class="cv" id="csS">€ 0</div></div>
        </div>
      </div>
      <div class="sh">
        <h2>Ultimi</h2>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="sort-btn" id="sortHome" title="Ordina per data" aria-label="Ordina">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M6 11l6-6 6 6"/></svg>
          </button>
          <div class="search-slot">
            <div class="search-expand" id="searchHome">
              <button type="button" class="s-ico" id="searchBtn" aria-label="Cerca">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              </button>
              <input type="text" id="searchIn" placeholder="Cerca..." autocomplete="off" enterkeyhint="search">
              <button type="button" class="s-close" id="searchCloseHome" aria-label="Chiudi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          <button class="lk" id="seeAll">Vedi tutti</button>
        </div>
      </div>
      <div class="list" id="last"></div>
    </section>

    <section id="lista" class="screen">
      <div class="sh">
        <h2>Lista</h2>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="sort-btn" id="sortLista" title="Ordina per data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M6 11l6-6 6 6"/></svg>
          </button>
          <div class="search-slot">
            <div class="search-expand" id="searchLista">
              <button type="button" class="s-ico" id="searchBtnLista" aria-label="Cerca">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              </button>
              <input type="text" id="searchInLista" placeholder="Cerca..." autocomplete="off" enterkeyhint="search">
              <button type="button" class="s-close" id="searchCloseLista" aria-label="Chiudi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="filters">
        <button class="fb active" data-f="all">Tutti</button>
        <button class="fb" data-f="A" id="fbA">A</button>
        <button class="fb b" data-f="B" id="fbB">B</button>
        <button class="fb" data-f="ok">Accreditati</button>
        <button class="fb o" data-f="no">Sospesi</button>
      </div>
      <div class="list" id="full"></div>
    </section>

    <section id="sospeso" class="screen">
      <div class="sh">
        <h2>In sospeso</h2>
        <button class="sort-btn" id="sortSos" title="Ordina per data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </div>
      <div class="list" id="sos"></div>
    </section>
  </main>

  <nav class="nav">
    <button class="nb active" data-s="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nb" data-s="lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Lista</span>
    </button>
    <button class="nb c" id="newBtn">
      <div class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
      <span>Nuovo</span>
    </button>
    <button class="nb" data-s="sospeso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Sospeso</span>
    </button>
  </nav>
</div>

<!-- FORM -->
<div class="ov" id="formOv">
  <div class="md">
    <div class="mh"><h2 id="ftitle">Nuovo movimento</h2><button class="x" id="fclose">×</button></div>
    <form id="fform">
      <div class="fg"><label>Importo (€) *</label><input type="number" id="fimp" step="0.01" min="0.01" required></div>
      <div class="fg"><label>Proprietario *</label>
        <div class="rg" id="fprop">
          <div class="ro active" data-v="A" id="roA">A</div>
          <div class="ro b" data-v="B" id="roB">B</div>
        </div>
      </div>
      <div class="fg"><label>Stato *</label>
        <div class="rg" id="fstato">
          <div class="ro active" data-v="Accreditato">Accreditato</div>
          <div class="ro o" data-v="In sospeso">In sospeso</div>
        </div>
      </div>
      <div class="fr">
        <div class="fg"><label>Tipo *</label>
          <select id="ftipo"><option>Bonifico</option><option>Contanti</option><option>Buoni postali</option><option>Altro</option></select>
        </div>
        <div class="fg"><label>Dettagli</label>
          <select id="fdet"><option value="">—</option><option>Nascita</option><option>Regalo</option><option>Mancia</option><option>Altro</option></select>
        </div>
      </div>
      <div class="fg"><label>Data</label><input type="date" id="fdata"></div>
      <div class="fg"><label>Occasione</label><input type="text" id="focc"></div>
      <div class="fg"><label>Note / Da chi</label><textarea id="fnote"></textarea></div>
      <button type="submit" class="bs" id="fsave">Salva</button>
      <div class="brow" id="fedit" style="display:none">
        <button type="button" class="bdel" id="fdel">Elimina</button>
        <button type="button" class="bcan" id="fcan">Annulla</button>
      </div>
    </form>
  </div>
</div>

<!-- MENU -->
<div class="ov" id="menuOv">
  <div class="md">
    <div class="mh"><h2>Impostazioni</h2><button class="x" id="mclose">×</button></div>
    <div class="info">Personalizza i nomi e gestisci i dati. Tutto resta <b>solo su questo dispositivo</b>.</div>

    <div class="fg"><label>Tema</label>
      <div class="theme-row">
        <button type="button" class="theme-btn" data-theme="dark" id="themeDark">Scuro</button>
        <button type="button" class="theme-btn" data-theme="light" id="themeLight">Chiaro</button>
      </div>
    </div>
    <div class="fg"><label>Nome app</label><input type="text" id="cfgTitle" placeholder="Portafogli"></div>
    <div class="fr">
      <div class="fg"><label>Portafoglio 1</label><input type="text" id="cfgA" placeholder="Nome 1"></div>
      <div class="fg"><label>Portafoglio 2</label><input type="text" id="cfgB" placeholder="Nome 2"></div>
    </div>
    <button class="bs" id="btnSaveCfg" style="margin-bottom:8px">Salva personalizzazione</button>

    <div class="sep"></div>

    <button class="row" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <div>Esporta backup JSON<small>Completo: dati + impostazioni</small></div>
    </button>
    <button class="row" id="btnExportCsv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      <div>Esporta CSV<small>Per Google Fogli / Excel</small></div>
    </button>
    <button class="row" id="btnImport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div>Importa backup JSON<small>Solo file JSON di questa app</small></div>
    </button>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    <button class="row" id="btnClear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      <div>Svuota movimenti<small>Non cancella i nomi</small></div>
    </button>
  </div>
</div>

<!-- Dialog personalizzato -->
<div class="dlg-ov" id="dlgOv">
  <div class="dlg">
    <h3 id="dlgTitle">Avviso</h3>
    <p id="dlgMsg"></p>
    <div class="dlg-actions" id="dlgActions"></div>
  </div>
</div>

<script>
(function(){
  var KEY_TX = 'pf_tx_v4';
  var KEY_CFG = 'pf_cfg_v4';

  var cfg = { title: 'Portafogli', nameA: 'Portafoglio 1', nameB: 'Portafoglio 2', theme: 'dark' };
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(KEY_CFG) || '{}')); } catch(e){}
  if(cfg.theme !== 'light' && cfg.theme !== 'dark') cfg.theme = 'dark';

  var tx = [];
  try { tx = JSON.parse(localStorage.getItem(KEY_TX) || '[]'); } catch(e){ tx = []; }

  var chart = null, prop = 'A', stato = 'Accreditato', editId = null, filter = 'all';
  var sortDesc = true; // true = più recenti prima
  var searchQ = '';

  function euro(v){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(v||0); }

  function showDlg(opts){

  function normDate(raw){
    if(!raw) return '';
    var s = String(raw).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    var d = new Date(s);
    if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return '';
  }
  function fdate(d){
    var n = normDate(d); if(!n) return '';
    var p = n.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
  }
  function sortByDate(a,b){
    var cmp = normDate(a.data).localeCompare(normDate(b.data));
    return sortDesc ? -cmp : cmp;
  }

  // normalizza tx esistenti

    t.data = normDate(t.data);
    t.importo = Number(t.importo)||0;
    // migrazione vecchi nomi Michele/Emma → A/B se presenti
    if(t.proprietario === 'Michele') t.proprietario = 'A';
    if(t.proprietario === 'Emma') t.proprietario = 'B';
    if(t.proprietario !== 'A' && t.proprietario !== 'B'){
      if(t.proprietario === cfg.nameA) t.proprietario = 'A';
      else if(t.proprietario === cfg.nameB) t.proprietario = 'B';
      else t.proprietario = 'A';
    }
    return t;
  });

  function totals(){
    var a=0,b=0,s=0;
    tx.forEach(function(t){
      if(t.stato==='Accreditato'){ t.proprietario==='B' ? b+=t.importo : a+=t.importo; }

    var list = Object.keys(years).sort();
    sel.innerHTML = '<option value="all">Tutto</option>';
    list.forEach(function(y){ sel.innerHTML += '<option value="'+y+'">'+y+'</option>'; });
    if(cur==='all' || years[cur]) sel.value = cur; else sel.value = 'all';

  function matchSearch(t, q){
    if(!q) return true;
    var hay = [
      nameOf(t.proprietario), t.tipo, t.dettagli, t.stato, t.note, t.occasione,
      t.data, fdate(t.data), String(t.importo), euro(t.importo)
    ].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function render(){
    applyCfg();
    var t = totals();
    document.getElementById('csA').textContent = euro(t.a);
    document.getElementById('csB').textContent = euro(t.b);
    document.getElementById('csS').textContent = euro(t.s);
    fillYears();
    updateSortIcons();
    var sorted = tx.slice().sort(sortByDate);
    var q = searchQ;
    var lastList = sorted.filter(function(t){ return matchSearch(t,q); }).slice(0,6);
    if(!q) lastList = sorted.slice(0,6);
    draw(document.getElementById('last'), lastList);
    draw(document.getElementById('full'), filtered());
    draw(document.getElementById('sos'), tx.filter(function(t){ return t.stato==='In sospeso' && matchSearch(t,q); }).sort(sortByDate));
    updateChart();
  }

  function filtered(){
    var r = tx.slice().sort(sortByDate);
    if(filter==='A'||filter==='B') r = r.filter(function(t){ return t.proprietario===filter; });
    if(filter==='ok') r = r.filter(function(t){ return t.stato==='Accreditato'; });
    if(filter==='no') r = r.filter(function(t){ return t.stato==='In sospeso'; });
    if(searchQ) r = r.filter(function(t){ return matchSearch(t, searchQ); });
    return r;
  }

  var ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>';
  var ICO_NO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';

  function draw(el, list){
    if(!list.length){ el.innerHTML = '<div class="empty">Nessun movimento</div>'; return; }
    el.innerHTML = list.map(function(t){
      var ok = t.stato==='Accreditato';
      var cls = t.proprietario==='B' ? 'pb' : 'pa';
      var meta = t.tipo + (t.dettagli ? ' · '+t.dettagli : '');
      if(t.occasione) meta += ' · '+t.occasione;
      var stLabel = ok ? 'Accreditato' : 'Sospeso';
      return '<div class="tx '+cls+'" data-id="'+t.id+'">'+
        '<div class="ic '+(ok?'ok':'no')+'">'+(ok?ICO_OK:ICO_NO)+'</div>'+
        '<div class="bd">'+
          '<div class="tp"><span class="am">'+euro(t.importo)+'</span><span class="st '+(ok?'ok':'no')+'">'+stLabel+'</span></div>'+
          '<div class="mt"><b>'+nameOf(t.proprietario)+'</b> · '+meta+'</div>'+
          '<div class="mt">'+(t.note||'')+(t.note?' · ':'')+fdate(t.data)+'</div>'+
        '</div></div>';
    }).join('');
    el.querySelectorAll('.tx').forEach(function(node){
      node.addEventListener('click', function(){ openEdit(node.getAttribute('data-id')); });
    });

  var screens = ['home','lista','sospeso'];

  function go(id, dir, fromHistory){
    if(id === currentScreen) return;
    var prev = currentScreen;
    var fromLeft = false;
    if(dir === 'left') fromLeft = true;
    else if(dir === 'right') fromLeft = false;
    else {
      var pi = screens.indexOf(prev), ni = screens.indexOf(id);
      fromLeft = ni < pi;
    }
    document.querySelectorAll('.screen').forEach(function(s){
      s.classList.remove('active','from-left');
      s.style.animation = 'none';
    });
    var el = document.getElementById(id);
    void el.offsetWidth;
    el.style.animation = '';
    if(fromLeft) el.classList.add('from-left');
    el.classList.add('active');
    currentScreen = id;
    document.querySelectorAll('.nb[data-s]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-s')===id);
    });
    if(id === 'home'){
      filter = 'all';
      document.querySelectorAll('.cs').forEach(function(c){ c.classList.remove('on'); });
      document.querySelectorAll('.fb[data-f]').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-f') === 'all');
      });
      draw(document.getElementById('full'), filtered());
    }
    if(!fromHistory){
      try { history.pushState({ screen: id }, ''); } catch(e){}
    }
  }

  // Swipe tra schede
  (function(){
    var startX=0, startY=0, tracking=false;
    var main = document.querySelector('.main');
    main.addEventListener('touchstart', function(e){
      if(e.touches.length!==1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, {passive:true});
    main.addEventListener('touchend', function(e){
      if(!tracking) return;
      tracking = false;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if(Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy)*1.2) return;
      var idx = screens.indexOf(currentScreen);
      if(dx < 0 && idx < screens.length-1) go(screens[idx+1], 'right');
      else if(dx > 0 && idx > 0) go(screens[idx-1], 'left');
    }, {passive:true});
  })();

  document.getElementById('btnExportCsv').addEventListener('click', function(){
    function esc(v){
      var s = (v == null ? '' : String(v));
      if(/[",\n\r]/.test(s)) s = '"'+s.replace(/"/g, '""')+'"';
      return s;
    }
    var headers = ['Data','Proprietario','Importo','Stato','Tipo','Dettagli','Occasione','Note'];
    var lines = [headers.join(',')];
    var sorted = tx.slice().sort(function(a,b){ return normDate(a.data).localeCompare(normDate(b.data)); });
    sorted.forEach(function(t){
      lines.push([
        esc(normDate(t.data)),
        esc(nameOf(t.proprietario)),
        esc(String(t.importo).replace('.', ',')),
        esc(t.stato),
        esc(t.tipo),
        esc(t.dettagli),
        esc(t.occasione),
        esc(t.note)
      ].join(','));
    });
    // BOM per Excel / Google Fogli con accenti corretti
    var csv = '\uFEFF' + lines.join('\r\n');
    downloadBlob(
      new Blob([csv], {type:'text/csv;charset=utf-8'}),
      'portafogli-'+new Date().toISOString().slice(0,10)+'.csv'
    );
    document.getElementById('menuOv').classList.remove('open');

  document.getElementById('fileIn').addEventListener('change', function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var list = [];
        if(Array.isArray(data)) list = data;
        else if(data && Array.isArray(data.records)) list = data.records;
        else if(data && Array.isArray(data.transactions)) list = data.transactions;
        else throw new Error('fmt');

        list = list.filter(function(t){ return t && t.importo!=null; }).map(function(t){
          var p = t.proprietario;
          if(p==='Michele' || p===cfg.nameA) p='A';
          else if(p==='Emma' || p===cfg.nameB) p='B';
          else if(p!=='A' && p!=='B') p='A';
          return {
            id: t.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
            importo: Number(t.importo)||0,
            tipo: t.tipo||'Bonifico',
            dettagli: t.dettagli||'',
            proprietario: p,
            stato: t.stato||'Accreditato',
            data: normDate(t.data),
            note: t.note||'',
            occasione: t.occasione||''
          };
        });

        if(data && data.config){
          if(data.config.title) cfg.title = data.config.title;
          if(data.config.nameA) cfg.nameA = data.config.nameA;
          if(data.config.nameB) cfg.nameB = data.config.nameB;
          if(data.config.theme === 'light' || data.config.theme === 'dark') cfg.theme = data.config.theme;
          saveCfg();
        }

        var extra = data.config ? ' e le impostazioni' : '';
        showDlg({
          title: 'Importa backup',
          msg: 'Verranno importati '+list.length+' movimenti'+extra+'. I dati attuali verranno sostituiti.',
          confirm: true, okText: 'Importa',
          onOk: function(){
            tx = list;
            localStorage.setItem(KEY_TX, JSON.stringify(tx));
            document.getElementById('per').value = 'all';
            render();
            document.getElementById('menuOv').classList.remove('open');
            showDlg({ title: 'Import completato', msg: list.length+' movimenti caricati correttamente.' });
          }
        });
      }catch(err){ showDlg({ title: 'Errore', msg: 'Il file non è valido o è vuoto.' }); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  /* Chart */
  function setupChart(){
    if(typeof Chart==='undefined'){
      document.querySelector('.cbox').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b93a7">Grafico non disponibile</div>';
      return;
    }
    var crosshair = {
      id: 'crosshair',
      afterDraw: function(c){
        if(c._crosshairX==null) return;
        var x = c._crosshairX, area = c.chartArea;
        if(x < area.left || x > area.right) return;
        var ctx = c.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, area.top);
        ctx.lineTo(x, area.bottom);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.setLineDash([4,4]);
        ctx.stroke();
        ctx.restore();
      }
    };
    chart = new Chart(document.getElementById('ch').getContext('2d'), {
      type: 'line',
      plugins: [crosshair],
      data: {
        labels: [],
        datasets: [
          { label: 'A', data: [], borderColor: '#3b82f6',
            backgroundColor: function(c){ var g=c.chart.ctx.createLinearGradient(0,0,0,240); g.addColorStop(0,'rgba(59,130,246,.35)'); g.addColorStop(1,'rgba(59,130,246,.02)'); return g; },
            fill: true, tension: .35, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2.5,
            pointBackgroundColor: '#3b82f6', pointBorderColor: '#3b82f6', pointBorderWidth: 0,
            pointStyle: 'circle' },
          { label: 'B', data: [], borderColor: '#ec4899',
            backgroundColor: function(c){ var g=c.chart.ctx.createLinearGradient(0,0,0,240); g.addColorStop(0,'rgba(236,72,153,.35)'); g.addColorStop(1,'rgba(236,72,153,.02)'); return g; },
            fill: true, tension: .35, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2.5,
            pointBackgroundColor: '#ec4899', pointBorderColor: '#ec4899', pointBorderWidth: 0,
            pointStyle: 'circle' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        onHover: function(evt, els){
          if(els && els.length){
            var meta = chart.getDatasetMeta(els[0].datasetIndex);
            var pt = meta.data[els[0].index];
            chart._crosshairX = pt ? pt.x : null;
          } else chart._crosshairX = null;
          chart.draw();
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true, mode: 'index', intersect: false,
            backgroundColor: 'rgba(22, 26, 38, 0.88)',
            titleColor: '#f1f3f7', bodyColor: '#d0d5e0',
            borderColor: 'rgba(255,255,255,.14)', borderWidth: 1,
            padding: 14, cornerRadius: 14,
            displayColors: true, usePointStyle: true, boxPadding: 6,
            boxWidth: 8, boxHeight: 8,
            titleFont: { size: 13, weight: '600' },
            bodyFont: { size: 12 },
            caretSize: 6,
            callbacks: {
              labelColor: function(ctx){
                var col = ctx.dataset.borderColor;
                return { borderColor: col, backgroundColor: col, borderWidth: 0 };
              },
              label: function(c){ return '  '+c.dataset.label+': '+euro(c.parsed.y); }
            }
          }
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,.04)', drawBorder: false }, ticks: { color: '#8b93a7', font: { size: 11 } } },
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.04)', drawBorder: false },
            ticks: { color: '#8b93a7', font: { size: 11 }, callback: function(v){ return v>=1000?'€'+(v/1000)+'k':'€'+v; } } }
        }
      }
    });
    document.querySelector('.cbox').addEventListener('mouseleave', function(){
      if(!chart) return; chart._crosshairX = null; chart.update('none');
    });
    document.querySelector('.cbox').addEventListener('touchend', function(){
      if(!chart) return;
      setTimeout(function(){ chart._crosshairX=null; chart.setActiveElements([]); chart.tooltip.setActiveElements([],{x:0,y:0}); chart.update('none'); }, 80);
    }, {passive:true});
    document.getElementById('per').addEventListener('change', updateChart);
  }

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function updateChartTheme(){
    if(!chart) return;
    var muted = cssVar('--muted') || '#8b93a7';
    var grid = cssVar('--grid') || 'rgba(255,255,255,.05)';
    var tipBg = cssVar('--tip-bg') || 'rgba(22,26,38,.88)';
    var tipTitle = cssVar('--tip-title') || '#f1f3f7';
    var tipBody = cssVar('--tip-body') || '#d0d5e0';
    var tipBd = cssVar('--tip-bd') || 'rgba(255,255,255,.14)';
    chart.options.scales.x.ticks.color = muted;
    chart.options.scales.y.ticks.color = muted;
    chart.options.scales.x.grid.color = grid;
    chart.options.scales.y.grid.color = grid;
    chart.options.plugins.tooltip.backgroundColor = tipBg;
    chart.options.plugins.tooltip.titleColor = tipTitle;
    chart.options.plugins.tooltip.bodyColor = tipBody;
    chart.options.plugins.tooltip.borderColor = tipBd;
    chart.update('none');
  }

  function updateChart(){
    if(!chart) return;
    chart.data.datasets[0].label = cfg.nameA;
    chart.data.datasets[1].label = cfg.nameB;
    var period = document.getElementById('per').value;
    var months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
    var buckets = {};
    tx.filter(function(t){ return t.stato==='Accreditato'; }).forEach(function(t){
      var nd = normDate(t.data); if(!nd || nd.length<7) return;
      var y = nd.slice(0,4), mo = nd.slice(5,7);
      if(period!=='all' && y!==period) return;
      var key = period==='all' ? y : (y+'-'+mo);
      if(!buckets[key]) buckets[key]={a:0,b:0};
      if(t.proprietario==='B') buckets[key].b += Number(t.importo)||0;
      else buckets[key].a += Number(t.importo)||0;
    });
    var keys = Object.keys(buckets).sort();
    var ca=0, cb=0, labels=[], da=[], db=[];
    keys.forEach(function(k){
      ca += buckets[k].a; cb += buckets[k].b;
      if(k.indexOf('-')===-1) labels.push(k);
      else { var p=k.split('-'); labels.push(months[parseInt(p[1],10)-1]+' '+p[0].slice(2)); }
      da.push(ca); db.push(cb);
    });
    if(!labels.length){ labels=['—']; da=[0]; db=[0]; }
    chart.data.labels = labels;
    chart.data.datasets[0].data = da;
    chart.data.datasets[1].data = db;
    chart.update();
  }

  // Blocco Indietro / swipe orizzontale: modal → Home → conferma uscita
  var allowExit = false;
  function lockHistory(){
    try { history.pushState({ app: 1, screen: currentScreen, t: Date.now() }, '', location.href); } catch(e){}
  }
  function armHistory(){
    try {
      history.replaceState({ app: 1, root: true }, '', location.href);
      lockHistory();
      lockHistory();
    } catch(e){}
  }
  function handleAppBack(){
    var formOv = document.getElementById('formOv');
    var menuOv = document.getElementById('menuOv');
    var dlgOv = document.getElementById('dlgOv');
    if(dlgOv.classList.contains('open')){ dlgOv.classList.remove('open'); return; }
    if(formOv.classList.contains('open')){ closeForm(); return; }
    if(menuOv.classList.contains('open')){ menuOv.classList.remove('open'); return; }
    if(currentScreen !== 'home'){ go('home', 'left', true); return; }
    showDlg({
      title: 'Uscire?',
      msg: 'Vuoi chiudere l\'app?',
      confirm: true,
      okText: 'Esci',
      cancelText: 'Resta',
      onOk: function(){
        allowExit = true;
        setTimeout(function(){
          try { history.go(-1); } catch(e){}
          try { window.close(); } catch(e){}
        }, 50);
      }
    });
  }

  window.addEventListener('popstate', function(){
    if(allowExit) return;
    // ri-blocca SUBITO così swipe/back non esce dalla pagina
    lockHistory();
    handleAppBack();
  });

  // Swipe dal bordo sinistro (gesto "indietro" touch)
  (function(){
    var x0 = 0, y0 = 0, tracking = false;
    document.addEventListener('touchstart', function(e){
      if(!e.touches || !e.touches.length) return;
      var t = e.touches[0];
      if(t.clientX <= 24){ tracking = true; x0 = t.clientX; y0 = t.clientY; }
      else tracking = false;
    }, { passive: true });
    document.addEventListener('touchmove', function(e){
      if(!tracking || !e.touches || !e.touches.length) return;
      var t = e.touches[0];
      var dx = t.clientX - x0;
      var dy = Math.abs(t.clientY - y0);
      if(dx > 40 && dx > dy * 1.4){
        tracking = false;
        lockHistory();
        handleAppBack();
      }
    }, { passive: true });
    document.addEventListener('touchend', function(){ tracking = false; }, { passive: true });
  })();

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && !allowExit) lockHistory();
  });

  document.addEventListener('DOMContentLoaded', function(){
    applyTheme();
    setupChart();
    render();
    armHistory();
  });
})();
</script>
</body>
</html>

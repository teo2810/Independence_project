<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="Gestione portafogli di Michele e Emma">
  <link rel="manifest" href="manifest.json">
  <title>Portafogli Figli</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --txt: #f0f2f5; --muted: #9aa0b4;
      --blue: #3b82f6; --pink: #ec4899; --green: #22c55e; --orange: #f59e0b;
      --border: rgba(255,255,255,0.06); --radius: 16px; --nav: 72px;
    }
    html, body {
      height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--txt); overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; position: relative; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 8px; padding-top: max(16px, env(safe-area-inset-top));
      background: var(--bg); z-index: 10;
    }
    .header h1 { font-size: 1.3rem; font-weight: 700; }
    .main { flex: 1; overflow-y: auto; padding: 8px 16px 100px; -webkit-overflow-scrolling: touch; }
    .screen { display: none; }
    .screen.active { display: block; }

    .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .tcard {
      background: var(--card); border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      border: 1px solid var(--border);
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; font-size: 1.05rem;
    }
    .avatar.michele { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .avatar.emma { background: linear-gradient(135deg, #ec4899, #be185d); }
    .tcard .name { font-size: 0.85rem; color: var(--muted); }
    .tcard .amount { font-size: 1.3rem; font-weight: 700; }
    .tcard .status { font-size: 0.72rem; font-weight: 600; color: var(--green); }

    .banner {
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25);
      border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px; font-size: 0.88rem; color: var(--orange);
    }
    .banner b { color: #fbbf24; }

    .chart-card {
      background: var(--card); border-radius: var(--radius); padding: 14px;
      margin-bottom: 18px; border: 1px solid var(--border);
    }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .chart-header h2 { font-size: 0.95rem; font-weight: 600; }
    .period-select {
      background: var(--bg); color: var(--txt); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 8px; font-size: 0.8rem; outline: none;
    }
    .chart-box { position: relative; height: 190px; }
    .legend {
      display: flex; justify-content: center; gap: 18px; margin-top: 10px;
      font-size: 0.78rem; color: var(--muted);
    }
    .legend i {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
    }
    .legend .michele { background: var(--blue); }
    .legend .emma { background: var(--pink); }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .section-header h2 { font-size: 0.95rem; font-weight: 600; }
    .link-btn { background: none; border: none; color: var(--blue); font-size: 0.82rem; font-weight: 500; cursor: pointer; }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .tx {
      background: var(--card); border-radius: 14px; padding: 12px 14px;
      display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); cursor: pointer;
    }
    .tx:active { background: #222633; }
    .tx-icon {
      width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0;
    }
    .tx-icon.ok { background: rgba(34,197,94,0.15); color: var(--green); }
    .tx-icon.no { background: rgba(245,158,11,0.15); color: var(--orange); }
    .tx-body { flex: 1; min-width: 0; }
    .tx-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1px; }
    .tx-amount { font-weight: 700; font-size: 0.95rem; }
    .tx-status { font-size: 0.72rem; font-weight: 600; }
    .tx-status.ok { color: var(--green); }
    .tx-status.no { color: var(--orange); }
    .tx-meta { font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta b { font-weight: 500; color: var(--txt); }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
      height: var(--nav); background: rgba(15,17,23,0.93);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom); z-index: 100;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.68rem; cursor: pointer; padding: 6px 10px; flex: 1;
    }
    .nav-btn.active { color: var(--blue); }
    .nav-btn.center { position: relative; top: -16px; }
    .plus {
      width: 50px; height: 50px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; color: #fff; font-weight: 300;
      box-shadow: 0 4px 14px rgba(59,130,246,0.4);
    }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      border-radius: 20px; padding: 7px 14px; font-size: 0.8rem; cursor: pointer;
    }
    .filter-btn.active { background: rgba(59,130,246,0.15); border-color: var(--blue); color: var(--blue); }
    .filter-btn.emma.active { background: rgba(236,72,153,0.15); border-color: var(--pink); color: var(--pink); }
    .filter-btn.orange.active { background: rgba(245,158,11,0.15); border-color: var(--orange); color: var(--orange); }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200;
      display: none; align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card); width: 100%; max-width: 480px;
      border-radius: 20px 20px 0 0; padding: 18px 18px 28px;
      max-height: 92vh; overflow-y: auto; animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { font-size: 1.15rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; padding: 4px 8px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 13px; color: var(--txt); font-size: 0.95rem; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--blue); }
    .form-group textarea { resize: vertical; min-height: 64px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .radio-group { display: flex; gap: 8px; }
    .radio {
      flex: 1; text-align: center; padding: 11px 6px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: 0.15s;
    }
    .radio.active { border-color: var(--blue); background: rgba(59,130,246,0.12); color: var(--blue); }
    .radio.emma.active { border-color: var(--pink); background: rgba(236,72,153,0.12); color: var(--pink); }
    .radio.orange.active { border-color: var(--orange); background: rgba(245,158,11,0.12); color: var(--orange); }

    .btn-save {
      width: 100%; padding: 15px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none; border-radius: 14px; color: #fff; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 6px;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn-row button {
      flex: 1; padding: 12px; border-radius: 12px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: none;
    }
    .btn-delete { background: rgba(239,68,68,0.15); color: #ef4444; }
    .btn-cancel { background: var(--bg); color: var(--muted); border: 1px solid var(--border) !important; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Portafogli Figli</h1>
    </header>

    <main class="main">
      <section id="home" class="screen active">
        <div class="totals">
          <div class="tcard">
            <div class="avatar michele">M</div>
            <div class="name">Michele</div>
            <div class="amount" id="totalMichele">€ 0,00</div>
            <div class="status">Accreditato</div>
          </div>
          <div class="tcard">
            <div class="avatar emma">E</div>
            <div class="name">Emma</div>
            <div class="amount" id="totalEmma">€ 0,00</div>
            <div class="status">Accreditato</div>
          </div>
        </div>

        <div class="banner">⏱ In sospeso: <b id="totalSospeso">€ 0,00</b></div>

        <div class="chart-card">
          <div class="chart-header">
            <h2>Andamento</h2>
            <select id="periodSelect" class="period-select">
              <option value="all">Tutto</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
            </select>
          </div>
          <div class="chart-box"><canvas id="chartCanvas"></canvas></div>
          <div class="legend">
            <span><i class="michele"></i>Michele</span>
            <span><i class="emma"></i>Emma</span>
          </div>
        </div>

        <div class="section-header">
          <h2>Ultimi</h2>
          <button class="link-btn" id="seeAllBtn">Vedi tutti</button>
        </div>
        <div class="list" id="latestList"></div>
      </section>

      <section id="lista" class="screen">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Tutti</button>
          <button class="filter-btn" data-filter="Michele">Michele</button>
          <button class="filter-btn emma" data-filter="Emma">Emma</button>
          <button class="filter-btn" data-filter="ok">Accreditati</button>
          <button class="filter-btn orange" data-filter="no">Sospesi</button>
        </div>
        <div class="list" id="fullList"></div>
      </section>

      <section id="sospeso" class="screen">
        <div class="list" id="sospesoList"></div>
      </section>
    </main>

    <nav class="nav">
      <button class="nav-btn active" data-screen="home">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-screen="lista">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Lista</span>
      </button>
      <button class="nav-btn center" id="newBtn">
        <div class="plus">+</div>
        <span>Nuovo</span>
      </button>
      <button class="nav-btn" data-screen="sospeso">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Sospeso</span>
      </button>
    </nav>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="formTitle">Nuovo movimento</h2>
        <button class="close-btn" id="closeBtn">×</button>
      </div>
      <form id="txForm">
        <div class="form-group">
          <label>Importo (€) *</label>
          <input type="number" id="importo" step="0.01" min="0.01" placeholder="0,00" required>
        </div>
        <div class="form-group">
          <label>Proprietario *</label>
          <div class="radio-group" id="propGroup">
            <div class="radio active" data-value="Michele">Michele</div>
            <div class="radio emma" data-value="Emma">Emma</div>
          </div>
        </div>
        <div class="form-group">
          <label>Stato *</label>
          <div class="radio-group" id="statoGroup">
            <div class="radio active" data-value="Accreditato">Accreditato</div>
            <div class="radio orange" data-value="In sospeso">In sospeso</div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Tipo *</label>
            <select id="tipo">
              <option>Bonifico</option>
              <option>Contanti</option>
              <option>Buoni postali</option>
            </select>
          </div>
          <div class="form-group">
            <label>Dettagli *</label>
            <select id="dettagli">
              <option>Nascita</option>
              <option>Regalo</option>
              <option>Mancia</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="data">
        </div>
        <div class="form-group">
          <label>Occasione</label>
          <input type="text" id="occasione" placeholder="Natale 2024, 2 anni...">
        </div>
        <div class="form-group">
          <label>Note / Da chi</label>
          <textarea id="note" placeholder="nonna Antonietta..."></textarea>
        </div>
        <button type="submit" class="btn-save" id="saveBtn">Salva</button>
        <div class="btn-row" id="editActions" style="display:none">
          <button type="button" class="btn-delete" id="deleteBtn">Elimina</button>
          <button type="button" class="btn-cancel" id="cancelBtn">Annulla</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'portafogli_figli_tx';
    let transactions = [];
    let chart = null;
    let selectedProprietario = 'Michele';
    let selectedStato = 'Accreditato';
    let editingId = null;
    let currentFilter = 'all';

    try {
      transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (e) {
      transactions = [];
    }

    function formatEuro(value) {
      return new Intl.NumberFormat('it-IT', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2
      }).format(value);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString('it-IT', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
    }

    function calcTotals() {
      let michele = 0, emma = 0, sospeso = 0;
      transactions.forEach(function(t) {
        if (t.stato === 'Accreditato') {
          if (t.proprietario === 'Michele') michele += t.importo;
          else emma += t.importo;
        } else {
          sospeso += t.importo;
        }
      });
      return { michele: michele, emma: emma, sospeso: sospeso };
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      render();
    }

    function render() {
      var totals = calcTotals();
      document.getElementById('totalMichele').textContent = formatEuro(totals.michele);
      document.getElementById('totalEmma').textContent = formatEuro(totals.emma);
      document.getElementById('totalSospeso').textContent = formatEuro(totals.sospeso);

      var sorted = transactions.slice().sort(function(a, b) {
        return b.data.localeCompare(a.data);
      });

      renderList(document.getElementById('latestList'), sorted.slice(0, 5));
      renderList(document.getElementById('fullList'), getFiltered());
      renderList(document.getElementById('sospesoList'), transactions.filter(function(t) {
        return t.stato === 'In sospeso';
      }).sort(function(a, b) { return b.data.localeCompare(a.data); }));

      updateChart();
    }

    function getFiltered() {
      var list = transactions.slice().sort(function(a, b) {
        return b.data.localeCompare(a.data);
      });
      if (currentFilter === 'Michele' || currentFilter === 'Emma') {
        list = list.filter(function(t) { return t.proprietario === currentFilter; });
      }
      if (currentFilter === 'ok') {
        list = list.filter(function(t) { return t.stato === 'Accreditato'; });
      }
      if (currentFilter === 'no') {
        list = list.filter(function(t) { return t.stato === 'In sospeso'; });
      }
      return list;
    }

    function renderList(container, list) {
      if (!list.length) {
        container.innerHTML = '<div class="empty">Nessun movimento</div>';
        return;
      }
      container.innerHTML = list.map(function(t) {
        var ok = t.stato === 'Accreditato';
        var meta = t.tipo + ' · ' + t.dettagli;
        if (t.occasione) meta += ' · ' + t.occasione;
        return '<div class="tx" data-id="' + t.id + '">' +
          '<div class="tx-icon ' + (ok ? 'ok' : 'no') + '">' + (ok ? '↓' : '⏱') + '</div>' +
          '<div class="tx-body">' +
            '<div class="tx-top">' +
              '<span class="tx-amount">' + formatEuro(t.importo) + '</span>' +
              '<span class="tx-status ' + (ok ? 'ok' : 'no') + '">' + t.stato + '</span>' +
            '</div>' +
            '<div class="tx-meta"><b>' + t.proprietario + '</b> · ' + meta + '</div>' +
            '<div class="tx-meta">' + (t.note || '') + ' · ' + formatDate(t.data) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      container.querySelectorAll('.tx').forEach(function(el) {
        el.addEventListener('click', function() {
          openEdit(el.getAttribute('data-id'));
        });
      });
    }

    function goTo(screenId) {
      document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');

      document.querySelectorAll('.nav-btn[data-screen]').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-screen') === screenId);
      });
    }

    document.querySelectorAll('.nav-btn[data-screen]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        goTo(btn.getAttribute('data-screen'));
      });
    });

    document.getElementById('seeAllBtn').addEventListener('click', function() {
      goTo('lista');
    });

    document.getElementById('newBtn').addEventListener('click', openNew);

    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentFilter = btn.getAttribute('data-filter');
        document.querySelectorAll('.filter-btn').forEach(function(b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        renderList(document.getElementById('fullList'), getFiltered());
      });
    });

    function openNew() {
      editingId = null;
      document.getElementById('formTitle').textContent = 'Nuovo movimento';
      document.getElementById('txForm').reset();
      selectedProprietario = 'Michele';
      selectedStato = 'Accreditato';
      updateRadios();
      document.getElementById('data').value = new Date().toISOString().slice(0, 10);
      document.getElementById('editActions').style.display = 'none';
      document.getElementById('saveBtn').textContent = 'Salva';
      document.getElementById('overlay').classList.add('open');
    }

    function openEdit(id) {
      var t = transactions.find(function(x) { return x.id === id; });
      if (!t) return;
      editingId = id;
      document.getElementById('formTitle').textContent = 'Modifica';
      document.getElementById('importo').value = t.importo;
      selectedProprietario = t.proprietario;
      selectedStato = t.stato;
      updateRadios();
      document.getElementById('tipo').value = t.tipo;
      document.getElementById('dettagli').value = t.dettagli;
      document.getElementById('data').value = t.data;
      document.getElementById('occasione').value = t.occasione || '';
      document.getElementById('note').value = t.note || '';
      document.getElementById('editActions').style.display = 'flex';
      document.getElementById('saveBtn').textContent = 'Aggiorna';
      document.getElementById('overlay').classList.add('open');
    }

    function closeForm() {
      document.getElementById('overlay').classList.remove('open');
    }

    function updateRadios() {
      document.querySelectorAll('#propGroup .radio').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-value') === selectedProprietario);
      });
      document.querySelectorAll('#statoGroup .radio').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-value') === selectedStato);
      });
    }

    document.querySelectorAll('#propGroup .radio').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedProprietario = el.getAttribute('data-value');
        updateRadios();
      });
    });

    document.querySelectorAll('#statoGroup .radio').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedStato = el.getAttribute('data-value');
        updateRadios();
      });
    });

    document.getElementById('closeBtn').addEventListener('click', closeForm);
    document.getElementById('cancelBtn').addEventListener('click', closeForm);
    document.getElementById('overlay').addEventListener('click', function(e) {
      if (e.target === document.getElementById('overlay')) closeForm();
    });

    document.getElementById('deleteBtn').addEventListener('click', function() {
      if (!editingId || !confirm('Eliminare questo movimento?')) return;
      transactions = transactions.filter(function(t) { return t.id !== editingId; });
      save();
      closeForm();
    });

    document.getElementById('txForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var value = parseFloat(document.getElementById('importo').value);
      if (!value || value <= 0) {
        alert('Inserisci un importo valido');
        return;
      }

      var obj = {
        id: editingId || Date.now().toString(),
        importo: value,
        tipo: document.getElementById('tipo').value,
        dettagli: document.getElementById('dettagli').value,
        proprietario: selectedProprietario,
        stato: selectedStato,
        data: document.getElementById('data').value || new Date().toISOString().slice(0, 10),
        note: document.getElementById('note').value.trim(),
        occasione: document.getElementById('occasione').value.trim()
      };

      if (editingId) {
        var idx = transactions.findIndex(function(t) { return t.id === editingId; });
        if (idx >= 0) transactions[idx] = obj;
      } else {
        transactions.unshift(obj);
      }
      save();
      closeForm();
    });

    function setupChart() {
      if (typeof Chart === 'undefined') {
        document.querySelector('.chart-box').innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9aa0b4;font-size:0.85rem">Grafico non disponibile</div>';
        return;
      }

      var ctx = document.getElementById('chartCanvas').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Michele',
              data: [],
              borderColor: '#3b82f6',
              backgroundColor: function(context) {
                var g = context.chart.ctx.createLinearGradient(0, 0, 0, 180);
                g.addColorStop(0, 'rgba(59,130,246,0.3)');
                g.addColorStop(1, 'rgba(59,130,246,0.02)');
                return g;
              },
              fill: true,
              tension: 0.4,
              pointRadius: 2.5,
              borderWidth: 2
            },
            {
              label: 'Emma',
              data: [],
              borderColor: '#ec4899',
              backgroundColor: function(context) {
                var g = context.chart.ctx.createLinearGradient(0, 0, 0, 180);
                g.addColorStop(0, 'rgba(236,72,153,0.3)');
                g.addColorStop(1, 'rgba(236,72,153,0.02)');
                return g;
              },
              fill: true,
              tension: 0.4,
              pointRadius: 2.5,
              borderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1d27',
              titleColor: '#f0f2f5',
              bodyColor: '#9aa0b4',
              borderColor: 'rgba(255,255,255,0.08)',
              borderWidth: 1,
              padding: 8,
              cornerRadius: 8,
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + formatEuro(context.parsed.y);
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { color: '#9aa0b4', font: { size: 10 } }
            },
            y: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: {
                color: '#9aa0b4',
                font: { size: 10 },
                callback: function(value) {
                  return value >= 1000 ? '€' + (value / 1000) + 'k' : '€' + value;
                }
              }
            }
          }
        }
      });

      document.getElementById('periodSelect').addEventListener('change', updateChart);
    }

    function updateChart() {
      if (!chart) return;

      var period = document.getElementById('periodSelect').value;
      var monthly = {};

      transactions.filter(function(t) { return t.stato === 'Accreditato'; }).forEach(function(t) {
        var d = new Date(t.data);
        var year = d.getFullYear().toString();
        if (period !== 'all' && year !== period) return;
        var key = year + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (!monthly[key]) monthly[key] = { michele: 0, emma: 0 };
        if (t.proprietario === 'Michele') monthly[key].michele += t.importo;
        else monthly[key].emma += t.importo;
      });

      var keys = Object.keys(monthly).sort();
      var monthNames = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
      var cumM = 0, cumE = 0;
      var labels = [], dataM = [], dataE = [];

      keys.forEach(function(key) {
        cumM += monthly[key].michele;
        cumE += monthly[key].emma;
        var parts = key.split('-');
        labels.push(monthNames[parseInt(parts[1], 10) - 1] + ' ' + parts[0].slice(2));
        dataM.push(cumM);
        dataE.push(cumE);
      });

      if (!labels.length) {
        labels = ['—'];
        dataM = [0];
        dataE = [0];
      }

      chart.data.labels = labels;
      chart.data.datasets[0].data = dataM;
      chart.data.datasets[1].data = dataE;
      chart.update();
    }

    document.addEventListener('DOMContentLoaded', function() {
      setupChart();
      render();
    });
  </script>
</body>
</html>
